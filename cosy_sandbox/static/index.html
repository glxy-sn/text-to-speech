<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosyVoice 3 Sandbox</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="icon-waves">
                    <span></span><span></span><span></span><span></span>
                </div>
                <h1>CosyVoice 3</h1>
            </div>
            <p class="subtitle">Next-gen voice cloning &amp; text-to-speech sandbox</p>
        </header>

        <main class="glass-panel">
            <form id="tts-form">
                <div class="input-group">
                    <label for="reference_voice">Select Reference Voice</label>
                    <div class="select-wrapper">
                        <select id="reference_voice" name="reference_voice" required>
                            <option value="" disabled selected>Loading voices...</option>
                        </select>
                    </div>
                    <div class="audio-preview">
                        <span class="preview-label">Preview:</span>
                        <audio id="ref-audio-player" controls class="custom-audio"></audio>
                    </div>
                </div>

                <!-- Reference Audio Length Selector -->
                <div class="input-group">
                    <label>Reference Audio Length</label>
                    <div class="segment-control" id="ref-length-control" role="group" aria-label="Reference audio length">
                        <input type="radio" name="ref_length" id="len-short" value="short" checked>
                        <label for="len-short" class="segment-btn">
                            <span class="segment-icon">⚡</span>
                            <span class="segment-title">Short</span>
                            <span class="segment-sub">~5s</span>
                        </label>

                        <input type="radio" name="ref_length" id="len-medium" value="medium">
                        <label for="len-medium" class="segment-btn">
                            <span class="segment-icon">◎</span>
                            <span class="segment-title">Medium</span>
                            <span class="segment-sub">~20s</span>
                        </label>

                        <input type="radio" name="ref_length" id="len-long" value="long">
                        <label for="len-long" class="segment-btn">
                            <span class="segment-icon">◈</span>
                            <span class="segment-title">Long</span>
                            <span class="segment-sub">~30s</span>
                        </label>
                    </div>
                    <p class="field-hint">Longer references capture more voice nuance but take more time to transcribe.</p>
                </div>

                <div class="input-group">
                    <label for="target_language">Target Language</label>
                    <div class="select-wrapper">
                        <select id="target_language" name="target_language" required>
                            <option value="auto" selected>Auto Detect (Cross Language)</option>
                            <option value="english">English</option>
                            <option value="chinese">Chinese</option>
                        </select>
                    </div>
                </div>

                <!-- Pace Slider -->
                <div class="input-group">
                    <div class="slider-header">
                        <label for="speed-slider">Output Pace</label>
                        <div class="slider-value-badge">
                            <span id="speed-display">1.00</span><span class="slider-unit">×</span>
                        </div>
                    </div>
                    <div class="range-track-wrapper">
                        <input
                            type="range"
                            id="speed-slider"
                            name="speed"
                            min="0.5"
                            max="2.0"
                            step="0.05"
                            value="1.0"
                        >
                        <div class="range-ticks">
                            <span>0.5×</span>
                            <span>1.0×</span>
                            <span>1.5×</span>
                            <span>2.0×</span>
                        </div>
                    </div>
                    <p class="field-hint">Multiplied on top of auto pace normalization. 1.0× = normalized baseline.</p>
                </div>

                <div class="input-group">
                    <label for="text">Text to Synthesize</label>
                    <textarea id="text" name="text" rows="4" placeholder="Enter the text you want to hear..." required></textarea>
                </div>

                <button type="submit" id="generate-btn" class="btn-primary">
                    <span class="btn-text">Generate Speech</span>
                    <div class="loader" id="btn-loader" style="display: none;"></div>
                </button>
            </form>

            <div class="result-section" id="result-section" style="display: none;">
                <h3>Generated Output</h3>
                <!-- Pace info badge -->
                <div class="pace-badge" id="pace-badge" style="display: none;">
                    <span class="pace-icon">🎙</span>
                    <div class="pace-details">
                        <span id="pace-wpm-text"></span>
                        <span class="pace-sep">·</span>
                        <span id="pace-norm-text"></span>
                        <span class="pace-sep">·</span>
                        <span id="pace-final-text"></span>
                    </div>
                </div>
                <div class="audio-player-container">
                    <audio id="output-audio" controls class="custom-audio"></audio>
                    <a id="download-link" class="btn-secondary" download="output.wav">Download</a>
                </div>
            </div>
            
            <div id="error-message" class="error-toast" style="display: none;"></div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
